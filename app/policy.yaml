# DataKeeper CSO 분류·접근 정책
#
# 등급 순서와 레거시 변환은 app.engine의 결정론적 코드와 동일해야 한다.

grades:
  O:
    rank: 0
    name: Open
    label: 공개
  S:
    rank: 1
    name: Sensitive
    label: 민감
  C:
    rank: 2
    name: Classified
    label: 기밀

legacy_mapping:
  D0: O
  D1: S
  D2: S
  D3: S
  D4: C

classification:
  confidence_threshold: 0.8
  uncertain_status: pending_review

access:
  confirmed_only: true
  default_deny: true
  # 사용자 등급 이상의 섹션은 조회·검색·LLM 컨텍스트에 진입하지 않는다.
  allow_when_user_rank_gte_section_rank: true
