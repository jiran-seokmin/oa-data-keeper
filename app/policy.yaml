# 접근 제어 엔진 정책
# 판정은 이 파일 + engine.py의 결정론적 코드로만 이루어진다 (LLM 미사용).

# 기본 매트릭스: gap = 사용자 접근 등급(C) - 데이터 보안 등급(D)
matrix:
  ">=0": 4   # A4 전체 접근
  "-1": 2    # A2 의미 제한
  "-2": 1    # A1 정보 마스킹
  "<=-3": 0  # A0 차단

# 컨텍스트 보정 규칙
modifiers:
  # 담당 부서의 데이터면 접근 모드 +1단계 (D4는 어떤 보정으로도 상승 불가)
  department_boost:
    enabled: true
  # 판단/집계 목적 질의면 A1/A2 판정 섹션을 A3(노출 제한)로 승격
  # → AI가 추론 근거로는 사용하되 내용을 직접 언급하지 않음
  judgment_a3:
    enabled: true

# 외부 채널(외부용 봇, 미인증 세션) 하드 캡: D0만 A4, 나머지 전부 A0
external_channel:
  public_only: true

# 불변 규칙 (코드에 하드코딩, 여기서 끌 수 없음):
# - D4는 컨텍스트 보정으로 상승하지 않는다
# - 보안 등급이 없는 섹션은 D4로 간주한다 (default-deny)
